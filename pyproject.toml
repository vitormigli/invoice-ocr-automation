[project]
name = "invoice-ocr-automation"
version = "0.1.0"
description = "Automated invoice intake pipeline: OCR (PaddleOCR) + rule-based extraction + routing, fully local"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "paddleocr>=3.7",
    "paddlepaddle>=3.0",
    "pillow>=10.4",
    "faker>=28.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_automation"]
